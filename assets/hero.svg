<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e5e5e5"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <radialGradient id="redGlow">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1a1a" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="440" rx="18" fill="#0b0b0b"/>
  <rect x="0.5" y="0.5" width="899" height="439" rx="18" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- animated red edge sweep along the top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#edge)">
    <animate attributeName="x" values="-900;900" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- brand block (left) -->
  <circle cx="200" cy="170" r="150" fill="url(#redGlow)">
    <animate attributeName="r" values="140;160;140" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="168" text-anchor="middle" fill="url(#silver)" font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-size="66" font-weight="900" font-style="italic">LUNEX</text>
  <!-- red slash on the X -->
  <line x1="320" y1="92" x2="368" y2="200" stroke="#ff1a1a" stroke-width="6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="200" y="220" text-anchor="middle" fill="#ff1a1a" font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" letter-spacing="14">TECH</text>
  <text x="200" y="262" text-anchor="middle" fill="#e5e5e5" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="4">FROM IDEA TO IMPACT<tspan fill="#ff1a1a">.</tspan></text>
  <rect x="150" y="290" width="100" height="3" fill="#ff1a1a">
    <animate attributeName="width" values="20;100;20" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="200" y="330" text-anchor="middle" fill="#e5e5e5" fill-opacity="0.6" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="3">TECHNOLOGY · CREATIVITY · PEOPLE</text>
  <text x="200" y="352" text-anchor="middle" fill="#e5e5e5" fill-opacity="0.6" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2">Kaushik · Founder</text>

  <!-- code window (right) -->
  <rect x="380" y="40" width="490" height="360" rx="14" fill="#1a1a1a" stroke="#ff1a1a" stroke-opacity="0.35"/>
  <rect x="380" y="40" width="490" height="36" rx="14" fill="#0b0b0b"/>
  <circle cx="402" cy="58" r="5" fill="#ff1a1a"/>
  <circle cx="420" cy="58" r="5" fill="#e5e5e5" fill-opacity="0.5"/>
  <circle cx="438" cy="58" r="5" fill="#e5e5e5" fill-opacity="0.25"/>
  <text x="625" y="63" text-anchor="middle" fill="#e5e5e5" fill-opacity="0.6" font-family="Consolas, monospace" font-size="13">lunex.tsx</text>

  <g font-family="Consolas, monospace" font-size="15">
    <text x="404" y="104" fill="#e5e5e5" opacity="0">const <tspan fill="#ff1a1a">founder</tspan> = {
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/></text>
    <text x="420" y="128" fill="#e5e5e5" opacity="0">company: <tspan fill="#ff6b6b">"Lunex Tech"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/></text>
    <text x="420" y="152" fill="#e5e5e5" opacity="0">also: <tspan fill="#ff6b6b">"HITHOZHA"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/></text>
    <text x="420" y="176" fill="#e5e5e5" opacity="0">stack: [<tspan fill="#ff6b6b">"React"</tspan>, <tspan fill="#ff6b6b">"Next.js"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>
    <text x="436" y="200" fill="#e5e5e5" opacity="0"><tspan fill="#ff6b6b">"Tailwind"</tspan>, <tspan fill="#ff6b6b">"Supabase"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
    <text x="420" y="224" fill="#e5e5e5" opacity="0">builds: [<tspan fill="#ff6b6b">"AI products"</tspan>, <tspan fill="#ff6b6b">"web apps"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/></text>
    <text x="420" y="248" fill="#e5e5e5" opacity="0">mission: <tspan fill="#ff6b6b">"From idea to impact"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/></text>
    <text x="404" y="272" fill="#e5e5e5" opacity="0">};
      <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/></text>
    <text x="404" y="304" fill="#e5e5e5" fill-opacity="0.5" opacity="0">// shipping something new every week
      <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/></text>
    <text x="404" y="328" fill="#e5e5e5" opacity="0"><tspan fill="#ff1a1a">founder</tspan>.ship();
      <animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.4s" fill="freeze"/></text>
  </g>
  <rect x="404" y="340" width="9" height="18" fill="#ff1a1a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
