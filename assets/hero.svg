<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="896" height="416" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="40" rx="16" fill="#161b22"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="14">kaushik.tsx</text>

  <!-- line numbers -->
  <g fill="#484f58" font-family="Consolas, monospace" font-size="16">
    <text x="28" y="88">1</text><text x="28" y="116">2</text><text x="28" y="144">3</text>
    <text x="28" y="172">4</text><text x="28" y="200">5</text><text x="28" y="228">6</text>
    <text x="28" y="256">7</text><text x="28" y="284">8</text><text x="28" y="312">9</text>
    <text x="28" y="340">10</text>
  </g>

  <!-- code, each line fades in in sequence -->
  <g font-family="Consolas, monospace" font-size="18">
    <text x="64" y="88" fill="#ff7b72" opacity="0">const <tspan fill="#d2a8ff">developer</tspan><tspan fill="#c9d1d9"> = {</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="116" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">name</tspan>: <tspan fill="#a5d6ff">"Kaushik"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="144" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">role</tspan>: <tspan fill="#a5d6ff">"Full-Stack Developer"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="172" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">stack</tspan>: [<tspan fill="#a5d6ff">"React"</tspan>, <tspan fill="#a5d6ff">"Next.js"</tspan>, <tspan fill="#a5d6ff">"Tailwind"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="200" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">builds</tspan>: [<tspan fill="#a5d6ff">"AI products"</tspan>, <tspan fill="#a5d6ff">"web apps"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="228" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">founder</tspan>: [<tspan fill="#a5d6ff">"Lunex Tech"</tspan>, <tspan fill="#a5d6ff">"HITHOZHA"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="256" fill="#c9d1d9" opacity="0">  <tspan fill="#79c0ff">coffee</tspan>: <tspan fill="#ffa657">Infinity</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="284" fill="#c9d1d9" opacity="0">};
      <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="312" fill="#8b949e" opacity="0">// shipping something new every week 🚀
      <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/></text>
    <text x="64" y="340" fill="#c9d1d9" opacity="0"><tspan fill="#d2a8ff">developer</tspan>.<tspan fill="#d2a8ff">ship</tspan>();
      <animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.4s" fill="freeze"/></text>
  </g>

  <!-- blinking cursor -->
  <rect x="64" y="352" width="10" height="20" fill="#3B82F6">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing orb on the right -->
  <circle cx="740" cy="210" r="110" fill="url(#glow)">
    <animate attributeName="r" values="100;120;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="210" r="60" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 8">
    <animateTransform attributeName="transform" type="rotate" from="0 740 210" to="360 740 210" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="740" y="218" text-anchor="middle" fill="#ffffff" font-family="Consolas, monospace" font-size="26" font-weight="bold">&lt;/&gt;</text>
</svg>
