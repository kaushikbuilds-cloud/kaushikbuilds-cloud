<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c98f"/>
      <stop offset="1" stop-color="#b8925a"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a52"/>
      <stop offset="1" stop-color="#07162e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#c9a96e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="900" height="440" fill="white"/>
      <circle cx="196" cy="200" r="58" fill="black"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="900" height="440" rx="18" fill="url(#navy)"/>
  <rect x="0.5" y="0.5" width="899" height="439" rx="18" fill="none" stroke="#c9a96e" stroke-opacity="0.35"/>

  <!-- brand block (left) -->
  <circle cx="160" cy="200" r="140" fill="url(#halo)">
    <animate attributeName="r" values="130;150;130" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g>
    <circle cx="160" cy="210" r="88" fill="url(#gold)" mask="url(#crescent)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- steam -->
    <path d="M150 150 C138 130, 162 118, 150 98" fill="none" stroke="#e2c98f" stroke-width="3" stroke-linecap="round" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;60" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M176 146 C164 124, 190 110, 176 84" fill="none" stroke="#e2c98f" stroke-width="3" stroke-linecap="round" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;60" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <!-- sparkles -->
    <path d="M226 96 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z" fill="#e2c98f">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M116 124 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z" fill="#e2c98f">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="160" y="342" text-anchor="middle" fill="#f8f5ee" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="10">LUNEX</text>
  <text x="160" y="374" text-anchor="middle" fill="#c9a96e" font-family="Georgia, serif" font-size="15" letter-spacing="3">TECH · FOUNDER</text>
  <text x="160" y="400" text-anchor="middle" fill="#f8f5ee" fill-opacity="0.7" font-family="Georgia, serif" font-size="13" letter-spacing="1">Kaushik · Full-Stack &amp; AI Builder</text>

  <!-- code window (right) -->
  <rect x="330" y="40" width="530" height="360" rx="14" fill="#0a1d3b" stroke="#c9a96e" stroke-opacity="0.4"/>
  <rect x="330" y="40" width="530" height="36" rx="14" fill="#0f2750"/>
  <circle cx="352" cy="58" r="5" fill="#c9a96e"/>
  <circle cx="370" cy="58" r="5" fill="#c9a96e" fill-opacity="0.6"/>
  <circle cx="388" cy="58" r="5" fill="#c9a96e" fill-opacity="0.3"/>
  <text x="595" y="63" text-anchor="middle" fill="#f8f5ee" fill-opacity="0.6" font-family="Consolas, monospace" font-size="13">lunex.tsx</text>

  <g font-family="Consolas, monospace" font-size="15">
    <text x="356" y="104" fill="#f8f5ee" opacity="0">const <tspan fill="#e2c98f">founder</tspan> = {
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/></text>
    <text x="372" y="128" fill="#f8f5ee" opacity="0">company: <tspan fill="#e2c98f">"Lunex Tech"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/></text>
    <text x="372" y="152" fill="#f8f5ee" opacity="0">also: <tspan fill="#e2c98f">"HITHOZHA"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/></text>
    <text x="372" y="176" fill="#f8f5ee" opacity="0">stack: [<tspan fill="#e2c98f">"React"</tspan>, <tspan fill="#e2c98f">"Next.js"</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>
    <text x="388" y="200" fill="#f8f5ee" opacity="0"><tspan fill="#e2c98f">"Tailwind"</tspan>, <tspan fill="#e2c98f">"Supabase"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
    <text x="372" y="224" fill="#f8f5ee" opacity="0">builds: [<tspan fill="#e2c98f">"AI products"</tspan>, <tspan fill="#e2c98f">"web apps"</tspan>],
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/></text>
    <text x="372" y="248" fill="#f8f5ee" opacity="0">coffee: <tspan fill="#e2c98f">Infinity</tspan>,
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/></text>
    <text x="356" y="272" fill="#f8f5ee" opacity="0">};
      <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/></text>
    <text x="356" y="304" fill="#c9a96e" fill-opacity="0.8" opacity="0">// shipping something new every week
      <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/></text>
    <text x="356" y="328" fill="#f8f5ee" opacity="0"><tspan fill="#e2c98f">founder</tspan>.ship();
      <animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.4s" fill="freeze"/></text>
  </g>
  <rect x="356" y="340" width="9" height="18" fill="#e2c98f">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
